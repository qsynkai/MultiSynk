<svg viewBox="0 0 320 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Shadow -->
  <ellipse cx="160" cy="142" rx="130" ry="7" fill="#000000" opacity="0.22"/>

  <!-- Wheel wells (cut) -->
  <circle cx="80" cy="120" r="26" fill="#0F0F18"/>
  <circle cx="242" cy="120" r="26" fill="#0F0F18"/>

  <!-- Cargo box (main body rear) -->
  <rect x="82" y="42" width="194" height="78" rx="3" fill="#E8E8EC"/>
  <!-- Cargo box top highlight -->
  <rect x="82" y="42" width="194" height="14" rx="3" fill="#F5F5F8"/>
  <!-- Cargo box bottom shadow -->
  <rect x="82" y="108" width="194" height="12" rx="2" fill="#C8C8D0"/>

  <!-- Cabin front section -->
  <path d="
    M 28,118
    L 26,105
    Q 26,90  34,78
    L 48,62
    L 60,50
    Q 68,42  82,40
    L 82,120
    Z
  " fill="#E0E0E4"/>

  <!-- Cabin top highlight -->
  <path d="
    M 52,63
    L 62,51
    Q 70,43  82,41
    L 82,54
    Q 70,54  64,60
    Z
  " fill="#F0F0F4"/>

  <!-- Windshield -->
  <path d="M 56,65 L 70,48 L 82,42 L 82,72 Z" fill="#8AB0D0" opacity="0.8"/>
  <!-- Windshield glare -->
  <path d="M 62,60 L 70,50 L 76,46 L 76,55 Z" fill="#FFFFFF" opacity="0.35"/>

  <!-- Cabin side window (small) -->
  <rect x="36" y="65" width="26" height="28" rx="3" fill="#8AACC8" opacity="0.7"/>

  <!-- Rear doors seam -->
  <line x1="174" y1="42" x2="174" y2="120" stroke="#BBBBC4" stroke-width="1.5"/>
  <!-- Rear door handle -->
  <rect x="170" y="82" width="8" height="3" rx="1.5" fill="#A0A0A8"/>

  <!-- Cargo door detail lines -->
  <line x1="82" y1="80" x2="174" y2="80" stroke="#D0D0D8" stroke-width="1"/>
  <line x1="120" y1="42" x2="120" y2="120" stroke="#D0D0D8" stroke-width="1"/>
  <line x1="174" y1="80" x2="275" y2="80" stroke="#D0D0D8" stroke-width="1"/>
  <line x1="225" y1="42" x2="225" y2="120" stroke="#D0D0D8" stroke-width="1"/>

  <!-- Cabin door seam -->
  <line x1="82" y1="42" x2="82" y2="120" stroke="#B8B8C0" stroke-width="2"/>

  <!-- Body bottom trim -->
  <rect x="26" y="114" width="250" height="6" rx="3" fill="#C0C0CA"/>

  <!-- Front headlight -->
  <path d="M 27,90 L 27,106 Q 36,110 46,108 L 50,92 Z" fill="#FFEEBB" opacity="0.9"/>
  <path d="M 27,90 L 27,97 Q 34,99 42,98 L 45,91 Z" fill="#FFFFFF" opacity="0.55"/>

  <!-- Front DRL strip -->
  <rect x="27" y="88" width="24" height="4" rx="2" fill="#E8F8FF" opacity="0.7"/>

  <!-- Rear light -->
  <path d="M 276,92 L 276,110 Q 266,113 256,111 L 254,92 Z" fill="#FF4433" opacity="0.85"/>
  <path d="M 276,92 L 276,100 Q 270,102 262,100 L 260,92 Z" fill="#FF8877" opacity="0.6"/>

  <!-- Front grille -->
  <path d="M 27,104 Q 27,116 36,118 L 55,118 L 55,104 Z" fill="#D0D0D8"/>
  <line x1="34" y1="107" x2="53" y2="107" stroke="#B0B0B8" stroke-width="1.5"/>
  <line x1="34" y1="112" x2="53" y2="112" stroke="#B0B0B8" stroke-width="1.5"/>

  <!-- Side mirror -->
  <path d="M 78,66 L 62,66 L 60,73 L 78,73 Z" fill="#D0D0D8"/>

  <!-- Cabin door handle -->
  <rect x="44" y="92" width="16" height="4" rx="2" fill="#C0C0C8" opacity="0.8"/>

  <!-- Company logo area (blank plate on cargo side) -->
  <rect x="100" y="56" width="54" height="30" rx="4" fill="#F0F0F4" opacity="0.6"/>

  <!-- Wheels -->
  <!-- Front wheel -->
  <circle cx="80" cy="122" r="22" fill="#1A1A22"/>
  <circle cx="80" cy="122" r="15" fill="#262630"/>
  <circle cx="80" cy="122" r="7"  fill="#3A3A48"/>
  <line x1="80" y1="109" x2="80" y2="135" stroke="#484856" stroke-width="2"/>
  <line x1="67" y1="122" x2="93" y2="122" stroke="#484856" stroke-width="2"/>
  <line x1="71" y1="112" x2="89" y2="132" stroke="#484856" stroke-width="1.5"/>
  <line x1="89" y1="112" x2="71" y2="132" stroke="#484856" stroke-width="1.5"/>

  <!-- Rear wheel -->
  <circle cx="242" cy="122" r="22" fill="#1A1A22"/>
  <circle cx="242" cy="122" r="15" fill="#262630"/>
  <circle cx="242" cy="122" r="7"  fill="#3A3A48"/>
  <line x1="242" y1="109" x2="242" y2="135" stroke="#484856" stroke-width="2"/>
  <line x1="229" y1="122" x2="255" y2="122" stroke="#484856" stroke-width="2"/>
  <line x1="233" y1="112" x2="251" y2="132" stroke="#484856" stroke-width="1.5"/>
  <line x1="251" y1="112" x2="233" y2="132" stroke="#484856" stroke-width="1.5"/>
</svg>
